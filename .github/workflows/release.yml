name: Release

# Publishes a GitHub Release with auto-generated notes whenever a version tag
# (v*) is pushed. The notes come straight from the git history, so nothing needs
# to be committed to main. Mark tags with a hyphen (e.g. v0.9.0-beta) to flag a
# pre-release.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate release notes
        run: node bin/changelog.js --section "${GITHUB_REF_NAME}" --stdout > RELEASE_NOTES.md

      - name: Show notes
        run: cat RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}
